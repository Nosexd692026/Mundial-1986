<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>México 1986 - Mundial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    <object id="mapa" data="mapa-mexico.svg" type="image/svg+xml"></object>
    font-family:'Segoe UI',sans-serif;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
    url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1600');
    background-size:cover;
    background-attachment:fixed;
    color:white;
    overflow-x:hidden;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:
    linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.9)),
    url('https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a?q=80&w=1600');
    background-size:cover;
    text-align:center;
    transition:1s;
}

#intro.oculto{
    opacity:0;
    pointer-events:none;
}

.pelota{
    font-size:90px;
    animation:botar 1s infinite;
}

@keyframes botar{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

.intro-texto{
    opacity:0;
    transform:translateY(40px);
    animation:aparecer 1.5s forwards;
    text-shadow:0 0 20px rgba(255,255,255,.5);
}

.intro-texto:nth-child(2){animation-delay:1s;}
.intro-texto:nth-child(3){animation-delay:2.5s;}
.intro-texto:nth-child(4){animation-delay:4s;}

.intro-texto h1{
    font-size:60px;
    color:#FFD700;
}

.intro-texto h2{
    font-size:34px;
}

.intro-texto p{
    font-size:22px;
}

@keyframes aparecer{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#btnSkip{
    margin-top:40px;
    padding:14px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#CE1126;
    font-weight:bold;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

#btnSkip:hover{
    transform:scale(1.1);
}

/* CONTENEDOR */

#contenedor{
    display:flex;
    gap:20px;
    padding:20px;
    min-height:100vh;
}

/* MAPA */

#mapa-container{
    width:60%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

#mapa-container h1{
    text-align:center;
    margin-bottom:10px;
    color:#FFD700;
}

#mapa-container p{
    text-align:center;
    margin-bottom:20px;
    color:#ddd;
}

svg{
    width:100%;
}

/* ESTADOS */

.estado{
    fill:#888;
    stroke:white;
    stroke-width:2;
    cursor:pointer;
    transition:.3s;
}

.estado:hover{
    fill:#00ff99;
    transform:scale(1.03);
}

.con-partido{
    fill:#CE1126;
    filter:drop-shadow(0 0 10px red);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{filter:drop-shadow(0 0 5px red);}
    50%{filter:drop-shadow(0 0 20px orange);}
    100%{filter:drop-shadow(0 0 5px red);}
}

/* INFO */

#info{
    width:40%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 30px rgba(0,0,0,.5);
    max-height:90vh;
    overflow-y:auto;
}

#info h2{
    color:#FFD700;
    margin-bottom:20px;
    border-bottom:2px solid rgba(255,255,255,.2);
    padding-bottom:10px;
}

#contenido{
    transition:.4s;
}

/* ESTADIO */

.nombre-estadio{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
    text-align:center;
    color:#FFD700;
}

.foto-estadio{
    width:100%;
    border-radius:15px;
    margin-bottom:20px;
    border:2px solid rgba(255,255,255,.3);
}

/* PARTIDOS */

.partido{
    background:rgba(255,255,255,.08);
    border-left:5px solid gold;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    transition:.3s;
}

.partido:hover{
    transform:translateX(8px);
    background:rgba(255,255,255,.15);
}

.fecha{
    color:#00ff99;
    font-weight:bold;
    margin-bottom:8px;
}

.marcador{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.detalle{
    color:#ddd;
    font-size:14px;
    line-height:1.5;
}

/* RESPONSIVE */

@media(max-width:900px){

    #contenedor{
        flex-direction:column;
    }

    #mapa-container,
    #info{
        width:100%;
    }

    .intro-texto h1{
        font-size:40px;
    }

    .intro-texto h2{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

    <div class="pelota">⚽</div>

    <div class="intro-texto">
        <h1>MÉXICO 1986</h1>
    </div>

    <div class="intro-texto">
        <h2>El Mundial de Maradona</h2>
    </div>

    <div class="intro-texto">
        <p>La Mano de Dios y el Gol del Siglo</p>
    </div>

    <button id="btnSkip">Entrar al Mundial →</button>

</div>
